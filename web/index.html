<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Overlap — live networking memory</title>
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #131317;
    --line: #24242b;
    --text: #ece8e1;
    --dim: #8a8781;
    --person: #e5b978;
    --topic: #6d93a3;
    --ok: #83b36b;
    --veto: #cc7061;
    --accent: #e5b978;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 400px; overflow: hidden;
  }
  /* ---------- graph side ---------- */
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #title {
    position: absolute; top: 22px; left: 26px; pointer-events: none;
  }
  #title h1 {
    margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em;
  }
  #title p { margin: 3px 0 0; color: var(--dim); font-size: 12.5px; max-width: 40ch; }
  #legend {
    position: absolute; bottom: 20px; left: 26px; display: flex; gap: 18px;
    color: var(--dim); font-size: 11.5px; pointer-events: none;
  }
  .key { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  #counters {
    position: absolute; top: 22px; right: 26px; display: flex; gap: 22px;
    pointer-events: none; text-align: right;
  }
  .counter b { display: block; font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .counter span { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; }

  /* ---------- side panel ---------- */
  #side {
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #controls { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 7px; cursor: pointer;
    background: #1e1e24; color: var(--text); border: 1px solid var(--line);
  }
  button:hover { background: #26262e; }
  button.primary { background: var(--accent); color: #17130c; border-color: var(--accent); font-weight: 600; }
  button.ghost { color: var(--dim); }
  #backends { padding: 0 16px 14px; font-size: 11px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); border-radius: 20px; padding: 2px 9px; }
  .chip b { color: var(--text); font-weight: 500; }

  .section { border-bottom: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .section > h2 {
    margin: 0; padding: 12px 16px 8px; font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .09em; color: var(--dim);
  }
  .scroll { overflow-y: auto; padding: 0 16px 14px; }
  #traces { flex: 1 1 55%; }
  #nudges { flex: 1 1 45%; }

  .trace { border-left: 2px solid var(--line); padding: 6px 0 8px 11px; margin-bottom: 9px; }
  .trace .ev { font-size: 11px; color: var(--dim); letter-spacing: .02em; }
  .trace .step { font-size: 12.5px; margin-top: 3px; }
  .trace .step em { font-style: normal; color: var(--dim); }
  .trace.approved { border-left-color: var(--ok); }
  .trace.vetoed { border-left-color: var(--veto); }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; letter-spacing: .05em; }
  .tag.ok { background: rgba(131,179,107,.16); color: var(--ok); }
  .tag.no { background: rgba(204,112,97,.16); color: var(--veto); }

  .nudge { background: #181820; border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; margin-bottom: 9px; }
  .nudge .to { font-size: 11px; color: var(--dim); }
  .nudge .msg { margin-top: 4px; font-size: 13px; }
  .nudge .why { margin-top: 6px; font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 6px; }
  .empty { color: var(--dim); font-size: 12.5px; padding: 2px 0 8px; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="title">
    <h1>Overlap</h1>
    <p>Memory of who is in the room and what they care about, built live from the event stream.</p>
  </div>
  <div id="counters">
    <div class="counter"><b id="n-people">0</b><span>people</span></div>
    <div class="counter"><b id="n-topics">0</b><span>topics</span></div>
    <div class="counter"><b id="n-met">0</b><span>met</span></div>
    <div class="counter"><b id="n-nudges">0</b><span>intros</span></div>
  </div>
  <div id="legend">
    <div class="key"><i class="dot" style="background:var(--person)"></i>person</div>
    <div class="key"><i class="dot" style="background:var(--topic)"></i>topic</div>
    <div class="key"><i class="dot" style="background:var(--ok)"></i>introduction made</div>
    <div class="key"><i class="dot" style="background:var(--veto)"></i>vetoed by critic</div>
  </div>
</div>

<div id="side">
  <div id="controls">
    <button class="primary" onclick="seed()">Fill the room</button>
    <button onclick="joinLive()">Check in live</button>
    <button onclick="tapInterest()">Add an interest</button>
    <button class="ghost" onclick="reset()">Reset</button>
  </div>
  <div id="backends"></div>

  <div class="section" id="traces">
    <h2>Agent activity</h2>
    <div class="scroll" id="trace-list"><div class="empty">Waiting for the first event.</div></div>
  </div>

  <div class="section" id="nudges">
    <h2>Introductions sent</h2>
    <div class="scroll" id="nudge-list"><div class="empty">None yet.</div></div>
  </div>
</div>

<script>
// ------------------------------------------------------------------ //
// force-directed graph, hand-rolled so there is no CDN to fail on us
// ------------------------------------------------------------------ //
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);

function resize() {
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);

let nodes = new Map();   // id -> {id,label,kind,x,y,vx,vy,born,weight}
let edges = [];          // {source,target,kind,status}
let highlight = new Set();
let highlightUntil = 0;

function syncGraph(g) {
  const seen = new Set();
  for (const n of g.nodes) {
    seen.add(n.id);
    if (!nodes.has(n.id)) {
      // new nodes enter near the middle with a little scatter, so growth reads
      const a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 90;
      nodes.set(n.id, {
        ...n, x: W / 2 + Math.cos(a) * r, y: H / 2 + Math.sin(a) * r,
        vx: 0, vy: 0, born: performance.now()
      });
    } else {
      Object.assign(nodes.get(n.id), { label: n.label, weight: n.weight, role: n.role });
    }
  }
  for (const id of [...nodes.keys()]) if (!seen.has(id)) nodes.delete(id);
  edges = g.edges.filter(e => nodes.has(e.source) && nodes.has(e.target));
}

function tick() {
  const arr = [...nodes.values()];
  const n = arr.length;
  // repulsion
  for (let i = 0; i < n; i++) {
    const a = arr[i];
    for (let j = i + 1; j < n; j++) {
      const b = arr[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { d2 = 1; dx = Math.random() - .5; dy = Math.random() - .5; }
      if (d2 > 160000) continue;
      const f = 3600 / d2;
      const d = Math.sqrt(d2);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }
  // springs
  for (const e of edges) {
    const a = nodes.get(e.source), b = nodes.get(e.target);
    if (!a || !b) continue;
    const rest = e.kind === 'interest' ? 112 : e.kind === 'met' ? 84 : 150;
    const k = e.kind === 'interest' ? 0.012 : e.kind === 'met' ? 0.02 : 0.004;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - rest) * k;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  }
  // centering, damping, and a hard clamp so nothing escapes the canvas
  const padX = 90, padY = 70;
  for (const p of arr) {
    p.vx += (W / 2 - p.x) * 0.0045;
    p.vy += (H / 2 - p.y) * 0.0045;
    p.vx *= 0.84; p.vy *= 0.84;
    p.x += p.vx; p.y += p.vy;
    if (p.x < padX) { p.x = padX; p.vx *= -0.4; }
    if (p.x > W - padX) { p.x = W - padX; p.vx *= -0.4; }
    if (p.y < padY) { p.y = padY; p.vy *= -0.4; }
    if (p.y > H - padY) { p.y = H - padY; p.vy *= -0.4; }
  }
}

function radius(p) {
  if (p.kind === 'topic') return 3.5 + Math.min(6, (p.weight || 1) * 1.1);
  return 7;
}

function draw() {
  const now = performance.now();
  const hot = now < highlightUntil;
  ctx.clearRect(0, 0, W, H);

  for (const e of edges) {
    const a = nodes.get(e.source), b = nodes.get(e.target);
    if (!a || !b) continue;
    const lit = hot && highlight.has(e.source) && highlight.has(e.target);
    if (e.kind === 'interest') {
      ctx.strokeStyle = lit ? 'rgba(229,185,120,.85)' : 'rgba(120,120,135,.16)';
      ctx.lineWidth = lit ? 2 : 1;
      ctx.setLineDash([]);
    } else if (e.kind === 'met') {
      ctx.strokeStyle = lit ? 'rgba(229,185,120,.9)' : 'rgba(190,190,205,.34)';
      ctx.lineWidth = lit ? 2.4 : 1.5;
      ctx.setLineDash([]);
    } else {
      const ok = e.status === 'approved';
      ctx.strokeStyle = ok ? 'rgba(131,179,107,.75)' : 'rgba(204,112,97,.5)';
      ctx.lineWidth = ok ? 2.2 : 1.4;
      ctx.setLineDash(ok ? [] : [4, 4]);
    }
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.setLineDash([]);

  for (const p of nodes.values()) {
    const age = now - p.born;
    const grow = Math.min(1, age / 420);
    const r = radius(p) * (0.4 + 0.6 * grow);
    const lit = hot && highlight.has(p.id);

    if (age < 900) {           // arrival pulse
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + (1 - age / 900) * 22, 0, 7);
      ctx.strokeStyle = `rgba(229,185,120,${0.35 * (1 - age / 900)})`;
      ctx.lineWidth = 1.5; ctx.stroke();
    }
    if (lit) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 9, 0, 7);
      ctx.fillStyle = 'rgba(229,185,120,.16)'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
    ctx.fillStyle = p.kind === 'topic' ? '#6d93a3' : '#e5b978';
    ctx.globalAlpha = grow; ctx.fill(); ctx.globalAlpha = 1;

    if (p.kind === 'person' || (p.weight || 0) > 1 || lit) {
      ctx.font = p.kind === 'person' ? '600 11.5px ui-sans-serif, system-ui' : '10.5px ui-sans-serif, system-ui';
      ctx.fillStyle = p.kind === 'person' ? 'rgba(236,232,225,.94)' : 'rgba(160,175,185,.72)';
      ctx.textAlign = 'center';
      ctx.fillText(p.label, p.x, p.y - r - 6);
    }
  }
}

function loop() { tick(); draw(); requestAnimationFrame(loop); }

// ------------------------------------------------------------------ //
// live feed
// ------------------------------------------------------------------ //
const traceList = document.getElementById('trace-list');
const nudgeList = document.getElementById('nudge-list');
let firstTrace = true, firstNudge = true;

function esc(s) { return String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function addTrace(rec) {
  if (firstTrace) { traceList.innerHTML = ''; firstTrace = false; }
  const critic = rec.steps.find(s => s.step === 'critic');
  const cls = critic ? (critic.approved ? 'approved' : 'vetoed') : '';
  const el = document.createElement('div');
  el.className = 'trace ' + cls;
  const p = rec.event.payload || {};
  const who = p.name || p.id || p.a || '';
  el.innerHTML =
    `<div class="ev">${esc(rec.event.type)} · ${esc(who)} · ${rec.ms}ms</div>` +
    rec.steps.map(s => {
      const tag = s.step === 'critic'
        ? `<span class="tag ${s.approved ? 'ok' : 'no'}">${s.approved ? 'approved' : 'vetoed'}</span> `
        : '';
      return `<div class="step"><em>${esc(s.step)}</em> ${tag}${esc(s.detail)}</div>`;
    }).join('');
  traceList.prepend(el);
  while (traceList.children.length > 40) traceList.lastChild.remove();

  // light up the path this decision walked
  if (rec.proposal) {
    highlight = new Set([rec.proposal.from_id, rec.proposal.to_id]);
    for (const t of (rec.proposal.shared_topics || [])) highlight.add('topic:' + t);
    if (rec.proposal.connector) highlight.add(rec.proposal.connector.connector_id);
    highlightUntil = performance.now() + 3500;
  }
}

function addNudge(n) {
  if (firstNudge) { nudgeList.innerHTML = ''; firstNudge = false; }
  const el = document.createElement('div');
  el.className = 'nudge';
  el.innerHTML =
    `<div class="to">to ${esc(n.to)} · about ${esc(n.about)}` +
    (n.connector ? ` · via ${esc(n.connector.connector_name)}` : '') + `</div>` +
    `<div class="msg">${esc(n.message)}</div>` +
    `<div class="why">${esc(n.why)}</div>`;
  nudgeList.prepend(el);
  while (nudgeList.children.length > 25) nudgeList.lastChild.remove();
}

function setStats(s) {
  document.getElementById('n-people').textContent = s.people ?? 0;
  document.getElementById('n-topics').textContent = s.topics ?? 0;
  document.getElementById('n-met').textContent = s.met ?? 0;
  document.getElementById('n-nudges').textContent = s.nudges ?? 0;
  if (s.backends) {
    document.getElementById('backends').innerHTML = Object.entries(s.backends)
      .map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join('');
  }
}

const es = new EventSource('/api/stream');
es.onmessage = (m) => {
  const { kind, data } = JSON.parse(m.data);
  if (kind === 'graph') syncGraph(data);
  else if (kind === 'stats') setStats(data);
  else if (kind === 'trace') addTrace(data);
  else if (kind === 'outbox') addNudge(data);
  else if (kind === 'reset') {
    nodes.clear(); edges = [];
    traceList.innerHTML = '<div class="empty">Waiting for the first event.</div>';
    nudgeList.innerHTML = '<div class="empty">None yet.</div>';
    firstTrace = firstNudge = true;
  }
};

// ------------------------------------------------------------------ //
// controls
// ------------------------------------------------------------------ //
const post = (url, body) => fetch(url, {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body || {})
});

function seed() { post('/api/seed', { delay: 0.8 }); }
function reset() { post('/api/reset'); }

function joinLive() {
  const name = prompt('Your name', 'Aaryaa');
  if (!name) return;
  const interests = prompt('Interests, comma separated',
    'graph databases, interface design, learning science');
  post('/api/event', {
    type: 'checkin',
    payload: {
      id: 'live-' + name.toLowerCase().replace(/\W+/g, ''),
      name, role: 'product designer',
      interests: (interests || '').split(',').map(s => s.trim()).filter(Boolean),
      location: 'Frontier Tower 16'
    }
  });
}

function tapInterest() {
  const id = prompt('Whose interest? (person id)', 'live-aaryaa');
  const topic = prompt('Topic', 'agent memory');
  if (!id || !topic) return;
  post('/api/event', { type: 'interest', payload: { id, topic } });
}

fetch('/api/stats').then(r => r.json()).then(setStats);
resize(); loop();
</script>
</body>
</html>
