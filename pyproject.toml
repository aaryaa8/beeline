[project]
name = "overlap"
version = "0.1.0"
description = "Live networking memory for an event. Memory Meets Motion hackathon."
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
stream = ["apache-iggy>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overlap"]
